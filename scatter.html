<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>期望 vs 预测 难度散点图</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
      body { background: #181824; color: #fff; font-family: 'Segoe UI', '微软雅黑', Arial, sans-serif; }
      h2 { color: #95c8ff; margin-left: 10vw; }
      #myplot { box-shadow: 0 4px 16px #0006; border-radius: 14px; }
      #stats { margin-left: 10vw; margin-bottom: 16px; }
    </style>
</head>
<body>
  <h2>期望 vs 预测 难度散点图</h2>
  <div id="stats"></div>
  <div id="myplot" style="width:90vw; height:70vh; margin:auto;"></div>
  <script>
    function classifyDelta(exp, pred) {
      const d = Math.abs(exp - pred);
      if (d === 0) return 'Exact';
      if (d <= 1) return 'Adjacent';
      if (d <= 2) return 'Within';
      return 'Miss';
    }
    const COLORS = {
      "Exact": "#8aceff",
      "Adjacent": "#77e89b",
      "Within": "#ffae54",
      "Miss": "#ec5659"
    };
    const MARKER_SIZE = 13, HOVER_SIZE = 22, MARKER_LINE_WIDTH = 1.5;

    fetch('estdan_scatter.json')
      .then(res=>res.json())
      .then(data => {
        data.forEach(item => {
          item.group = classifyDelta(item.expected, item.predicted);
        });

        // 统计
        const groupNames = ["Exact", "Adjacent", "Within", "Miss"];
        const groupStats = {};
        groupNames.forEach(g=>groupStats[g]=0);
        data.forEach(d=>groupStats[d.group]++);
        document.getElementById('stats').innerHTML =
          groupNames.map(g=>`<span style="color:${COLORS[g]}">${g}:</span> ${groupStats[g]}`).join('&nbsp;&nbsp;|&nbsp;&nbsp;');

        // 按分组分trace
        // 初始动画，所有点都先透明
        const tracesAllInvisible = groupNames.map(group => {
          const items = data.filter(d => d.group === group);
          return {
            x: items.map(d=>d.expected),
            y: items.map(d=>d.predicted),
            name: group,
            mode: "markers",
            text: items.map(d =>
              `<b>${d.name}</b><br><span style="color:#e1e1e1">期望:</span> <b>${d.expected}</b> &nbsp; <span style="color:#e1e1e1">预测:</span> <b>${d.predicted}</b><br>` +
              `<span style="color:${COLORS[group]}"><b>${d.delta}</b></span>`
            ),
            marker: {
              color: COLORS[group],
              size: MARKER_SIZE,
              line: {color:'#14141f',width:MARKER_LINE_WIDTH},
              opacity: 0       // 初始完全不显示，用于动画
            },
            hovertemplate: '%{text}<extra></extra>'
          };
        });

        // y=x 参考虚线
        const minX = Math.min(...data.map(d=>d.expected), ...data.map(d=>d.predicted), 0);
        const maxX = Math.max(...data.map(d=>d.expected), ...data.map(d=>d.predicted), 20);
        tracesAllInvisible.push({
          x: [minX, maxX],
          y: [minX, maxX],
          mode: "lines",
          line: {dash: 'dash', color: '#bbb', width: 2},
          hoverinfo: "skip",
          name: '参考虚线'
        });

        // step1：先画全透明
        Plotly.newPlot('myplot', tracesAllInvisible, {
          plot_bgcolor:'#23223b', paper_bgcolor:'#23223b',
          legend: {font:{color:'#fff'}, bgcolor:'#23223b', borderwidth:0, bordercolor:'#444'},
          margin:{l:64, r:32, t:44, b:64},
          xaxis:{
            title:'期望难度',
            tickformat: '.1f',
            color:'#d6f0ff',
            gridcolor:'#333',
            zeroline: false,
            linecolor:'#444',
            linewidth: 1.5
          },
          yaxis:{
            title:'预测难度',
            tickformat: '.1f',
            color:'#d6f0ff',
            gridcolor:'#333',
            zeroline: false,
            linecolor:'#444',
            linewidth: 1.5
          }
        }, {responsive:true});
        
        // step2：动画渐现
        setTimeout(()=>{
          // 准备完全可见的trace
          const tracesVisible = groupNames.map(group => {
            const items = data.filter(d => d.group === group);
            return {
              marker: {
                opacity: 0.85,
                color: COLORS[group],
                size: MARKER_SIZE,
                line: {color:'#14141f',width:MARKER_LINE_WIDTH}
              }
            };
          });
          Plotly.animate('myplot', {
            data: tracesVisible
          }, {
            transition: {duration: 900, easing:'cubic-in-out'},
            frame: {duration: 800, redraw: false}
          });
        }, 250);  // 总体动画出现时延

        // step3：增强交互-悬浮时点发光放大
        // 利用Plotly事件实现
        const plotDom = document.getElementById('myplot');
        plotDom.on('plotly_hover', ev => {
          // 高亮hover点
          const pn = ev.points[0].pointNumber, tn = ev.points[0].curveNumber;
          let update = {marker: {size: []}};
          // 必须按照顺序分别为每个trace维护
          for(let i=0;i<tracesAllInvisible.length-1;i++) {
            const len = tracesAllInvisible[i].x.length;
            update.marker.size[i] = new Array(len).fill(MARKER_SIZE);
          }
          update.marker.size[tn] = update.marker.size[tn].slice();
          update.marker.size[tn][pn] = HOVER_SIZE;
          Plotly.restyle('myplot', update, groupNames.map((_,i)=>i));
        });
        plotDom.on('plotly_unhover', () => {
          // 恢复所有点到默认大小
          for(let i=0;i<groupNames.length;i++)
            Plotly.restyle('myplot', {'marker.size': MARKER_SIZE}, [i]);
        });

      });
  </script>
</body>
</html>
