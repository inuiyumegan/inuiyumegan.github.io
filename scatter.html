<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>难度散点对比图</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
      body { background: #1a1a24; color: #fff; }
    </style>
</head>
<body>
  <h2>EXPECTED VS PREDICTED</h2>
  <div id="myplot" style="width:90vw; height:70vh;"></div>
  <script>
    // 预定义难度组的显示顺序和标签
    const groups = ["Exact", "Adjacent", "Within", "Miss"];
    const COLORS = {
      "Exact": "#85C4F9",
      "Adjacent": "#77e89b",
      "Within": "#ff9d3c",
      "Miss": "#db373c"
    };

    // 定义X轴和Y轴的标签顺序
    const order = ["α","β","γ","δ","ε","ζ","η"];
    const orderMap = order.reduce((a,k,i) => (a[k]=i,a), {})

    fetch('estdan_scatter.json')
      .then(res=>res.json())
      .then(data => {
         // 按 group 分组
         let traces = [];
         groups.forEach(group=>{
           let items = data.filter(d=>d.group===group);
           if(items.length===0) return;
           traces.push({
             x: items.map(d=>orderMap[d.expected]),
             y: items.map(d=>d.predicted),
             mode:'markers',
             name: group,
             text: items.map(d => `${d.name} — Exp: ${d.expected}　Got: ${d.predicted}`),
             marker: { color: COLORS[group], size:11, line:{color:'#222', width:1}},
           });
         });

         Plotly.newPlot('myplot', traces, {
           plot_bgcolor:'#23223b', paper_bgcolor:'#23223b',
           legend: {font:{color:'#fff'}, bgcolor:'#23223b'},
           xaxis:{
             title:'Expected',
             tickvals: order.map((v,i)=>i),
             ticktext: order,
             color:'#fff',
             gridcolor:'#444'
           },
           yaxis:{
             title:'Predicted',
             color:'#fff',
             gridcolor:'#444'
           }
         }, {responsive:true});
      })
  </script>
</body>
</html>
