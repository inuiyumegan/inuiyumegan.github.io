<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>期望 vs 预测 难度散点图</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { background: #181824; color: #fff; font-family: 'Segoe UI', '微软雅黑', Arial, sans-serif; }
        h2 { color: #95c8ff; margin-left: 10vw; }
        #myplot { box-shadow: 0 4px 16px #0006; border-radius: 14px; }
        #stats { margin-left: 10vw; margin-bottom: 16px; }
    </style>
</head>
<body>
  <h2>期望 vs 预测 难度散点图</h2>
  <div id="stats"></div>
  <div id="myplot" style="width:90vw; height:70vh; margin:auto;"></div>
  <script>
    function classifyDelta(exp, pred) {
      const d = Math.abs(exp - pred);
      if (d === 0) return 'Exact';
      if (d <= 1) return 'Adjacent';
      if (d <= 2) return 'Within';
      return 'Miss';
    }
    const COLORS = {
      "Exact": "#8aceff",
      "Adjacent": "#77e89b",
      "Within": "#ffae54",
      "Miss": "#ec5659"
    };
    const MARKER_SIZE = 11;
    const JITTER_UNIT = 0.14;

    fetch('estdan_scatter.json')
      .then(res=>res.json())
      .then(data => {
        data.forEach(item => {
          item.group = classifyDelta(item.expected, item.predicted);
        });

        const groupNames = ["Exact", "Adjacent", "Within", "Miss"];
        const groupStats = {};
        groupNames.forEach(g=>groupStats[g]=0);
        data.forEach(d=>groupStats[d.group]++);
        document.getElementById('stats').innerHTML =
          groupNames.map(g=>`<span style="color:${COLORS[g]}">${g}:</span> ${groupStats[g]}`).join('&nbsp;&nbsp;|&nbsp;&nbsp;');

        // jitter防重叠
        const posCount = {};
        data.forEach(d => {
          const key = `${d.expected}-${d.predicted}`;
          if (!posCount[key]) posCount[key] = 0;
          d.predicted_jitter = d.predicted + (posCount[key] * JITTER_UNIT - ((posCount[key]>0)?JITTER_UNIT/1.5:0));
          posCount[key]++;
        });

        // 每分组一个trace（以x轴分组以方便多曲同行tooltip）
        const traces = groupNames.map(group => {
          const items = data.filter(d => d.group === group);
          return {
            x: items.map(d=>d.expected),
            y: items.map(d=>d.predicted_jitter),
            name: group,
            // 标题样式与legend一致，主色块自动添加
            mode: "markers",
            text: items.map(d =>
              `${d.name} — Exp: ${d.expected}  Got: ${d.predicted}`
            ),
            marker: {
              color: COLORS[group],
              size: MARKER_SIZE,
              line: {color:'#14141f', width:1},
              opacity: 0.85
            },
            hovertemplate: '%{text}<extra></extra>',
          };
        });

        // y=x 参考虚线
        const minX = Math.min(...data.map(d=>d.expected), ...data.map(d=>d.predicted), 0);
        const maxX = Math.max(...data.map(d=>d.expected), ...data.map(d=>d.predicted), 20);
        traces.push({
          x: [minX, maxX],
          y: [minX, maxX],
          mode: "lines",
          line: {dash: 'dash', color: '#bbb', width: 2},
          hoverinfo: "skip",
          name: '参考虚线'
        });

        Plotly.newPlot('myplot', traces, {
          plot_bgcolor:'#23223b', paper_bgcolor:'#23223b',
          legend: {font:{color:'#fff'}, bgcolor:'#23223b', borderwidth:0, bordercolor:'#444'},
          margin:{l:64, r:32, t:44, b:64},
          dragmode: 'zoom',
          hovermode: 'x', // 关键：同行同x下所有点tooltip一起显示
          xaxis:{
            title:'期望难度',
            tickformat: '.1f',
            color:'#d6f0ff',
            gridcolor:'#333',
            zeroline: false,
            linecolor:'#444',
            linewidth: 1.5
          },
          yaxis:{
            title:'预测难度',
            tickformat: '.1f',
            color:'#d6f0ff',
            gridcolor:'#333',
            zeroline: false,
            linecolor:'#444',
            linewidth: 1.5
          },
          hoverlabel: {
            bgcolor: "#181824",
            bordercolor: "#222",
            font: {color: "#fff", size: 15}
          }
        }, {responsive:true});
      });
  </script>
</body>
</html>
