<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
<title>Dynamic Benchmark Report</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* === Font Override === */
body {
  font-family: 'Inter', sans-serif !important;
}

td, th {
  font-family: 'JetBrains Mono', monospace !important;
}

td {
  font-variant-numeric: tabular-nums;
}
  
body {
  background:#0e0f14;
  color:#dde1f5;
  font-family: monospace;
  margin:0;
}

.container {
  max-width:1100px;
  margin:auto;
  padding:20px;
}

h1 { font-size:32px; margin-bottom:20px; }

.chart-box {
  background:#16181f;
  border:1px solid #2a2d3a;
  padding:20px;
  margin-bottom:30px;
}

canvas { width:100%; height:400px; }

table {
  width:100%;
  border-collapse:collapse;
}

th, td {
  padding:6px 10px;
  border-bottom:1px solid #2a2d3a;
}

th { color:#626880; }

.flag-exact { color:#7dd3fc; }
.flag-adjacent { color:#4ade80; }
.flag-within { color:#fb923c; }
.flag-miss { color:#ef4444; }

#tooltip {
  position:absolute;
  background:#111;
  padding:8px;
  border:1px solid #333;
  pointer-events:none;
  opacity:0;
}
</style>

</head>

<body>
<div class="container">

<h1>Benchmark Report (Dynamic)</h1>

<div class="chart-box">
  <canvas id="scatter"></canvas>
</div>

<div class="chart-box">
  <table>
    <thead>
      <tr>
        <th>Song</th>
        <th>Expected</th>
        <th>Predicted</th>
        <th>Δ</th>
        <th>Flag</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

</div>

<div id="tooltip"></div>

<script>
function getDeltaValue(deltaStr){
  return parseFloat(deltaStr.replace('Δ=', ''));
}

function getFlag(delta){
  const d = Math.abs(delta);
  if (d <= 0.165) return 'exact';
  if (d <= 0.495) return 'adjacent';
  if (d <= 1.0) return 'within';
  return 'miss';
}

function getColor(delta){
  const d = Math.abs(delta);
  if (d <= 0.165) return '#7dd3fc';
  if (d <= 0.495) return '#4ade80';
  if (d <= 1.0) return '#fb923c';
  return '#ef4444';
}

async function init() {
  const res = await fetch('./estdan_scatter.json');
  const json = await res.json();

  const scatterData = json.map(d => {
    const delta = getDeltaValue(d.delta);
    return {
      x: d.expected,
      y: d.predicted,
      name: d.name,
      delta: d.delta,
      rawDelta: delta,
      backgroundColor: getColor(delta)
    };
  });

  renderChart(scatterData);
  renderTable(scatterData);
}

function renderChart(data){
  const ctx = document.getElementById('scatter');

  new Chart(ctx, {
    type: 'scatter',
    data: {
      datasets: [{
        data: data,
        pointRadius: 5
      }]
    },
    options: {
      responsive:true,
      plugins:{
        tooltip:{
          enabled:false,
          external: function(context){
            const tooltip = document.getElementById('tooltip');

            if (context.tooltip.opacity === 0){
              tooltip.style.opacity = 0;
              return;
            }

            const d = context.tooltip.dataPoints[0].raw;

            tooltip.innerHTML = `
              <b>${d.name}</b><br>
              Expected: ${d.x}<br>
              Predicted: ${d.y}<br>
              ${d.delta}
            `;

            tooltip.style.opacity = 1;
            tooltip.style.left = context.tooltip.caretX + 'px';
            tooltip.style.top = context.tooltip.caretY + 'px';
          }
        }
      },
      scales:{
        x:{ title:{display:true,text:'Expected'} },
        y:{ title:{display:true,text:'Predicted'} }
      }
    },
    plugins:[{
      id:'diagonal',
      afterDraw(chart){
        const {ctx, scales:{x,y}} = chart;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x.left, y.bottom);
        ctx.lineTo(x.right, y.top);
        ctx.strokeStyle = '#888';
        ctx.stroke();
        ctx.restore();
      }
    }]
  });
}

function renderTable(data){
  const tbody = document.getElementById('table-body');

  data.forEach(d=>{
    const flag = getFlag(d.rawDelta);

    const tr = document.createElement('tr');

    tr.innerHTML = `
      <td>${d.name}</td>
      <td>${d.x}</td>
      <td>${d.y}</td>
      <td>${d.delta}</td>
      <td class="flag-${flag}">${flag}</td>
    `;

    tbody.appendChild(tr);
  });
}

init();
</script>

</body>
</html>
