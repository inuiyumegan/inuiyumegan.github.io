<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Dan Est.</title>

  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

  <style>
    body {
      background: #181824;
      color: #fff;
      font-family: 'Segoe UI', '微软雅黑', Arial;
    }

    h2 {
      margin-left: 5vw;
      color: #8aceff;
    }

    #myplot {
      width: 90vw;
      height: 70vh;
      margin: auto;
      border-radius: 14px;
      box-shadow: 0 4px 16px #0006;
      position: relative;
    }

    #stats {
      margin-left: 5vw;
      margin-bottom: 10px;
    }

    /* 🔥 高级 tooltip */
    #tooltip {
      position: absolute;
      pointer-events: none;
      min-width: 220px;
      padding: 10px 14px;

      background: rgba(20,20,30,0.85);
      backdrop-filter: blur(10px);

      border: 1px solid #3a3a55;
      border-radius: 10px;

      box-shadow: 0 8px 32px #000a;

      opacity: 0;
      transform: translateY(6px);
      transition: all 0.12s ease;

      font-size: 14px;
      z-index: 10;
    }

    #tooltip.show {
      opacity: 1;
      transform: translateY(0);
    }

    .row {
      display: flex;
      align-items: center;
      margin-bottom: 4px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 6px;
    }
  </style>
</head>

<body>

<h2>Dan Est Scatter</h2>
<div id="stats"></div>

<div id="myplot"></div>
<div id="tooltip"></div>

<script>
const COLORS = {
  Exact: "#8aceff",
  Adjacent: "#77e89b",
  Within: "#ffae54",
  Miss: "#ec5659"
};

function classifyDelta(exp, pred) {
  const d = Math.abs(exp - pred);
  if (d === 0) return 'Exact';
  if (d <= 1) return 'Adjacent';
  if (d <= 2) return 'Within';
  return 'Miss';
}

function escapeHTML(str) {
  return str.replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    "\"":"&quot;","'":"&#39;"
  })[m]);
}

fetch('estdan_scatter.json')
.then(r => r.json())
.then(data => {

  // ===== 数据预处理 =====
  let minX = Infinity, maxX = -Infinity;
  let minY = Infinity, maxY = -Infinity;

  const groups = {
    Exact: [], Adjacent: [], Within: [], Miss: []
  };

  data.forEach(d => {
    d.group = classifyDelta(d.expected, d.predicted);
    groups[d.group].push(d);

    if (d.expected < minX) minX = d.expected;
    if (d.expected > maxX) maxX = d.expected;
    if (d.predicted < minY) minY = d.predicted;
    if (d.predicted > maxY) maxY = d.predicted;
  });

  // ===== stats =====
  document.getElementById('stats').innerHTML =
    Object.keys(groups).map(g =>
      `<span style="color:${COLORS[g]}">${g}:</span> ${groups[g].length}`
    ).join(" | ");

  // ===== traces =====
  const traces = Object.keys(groups).map(g => ({
    x: groups[g].map(d=>d.expected),
    y: groups[g].map(d=>d.predicted),
    mode: "markers",
    name: g,
    marker: {
      size: 10,
      color: COLORS[g],
      opacity: 0.85
    },
    hoverinfo: "skip"
  }));

  traces.push({
    x: [minX, maxX],
    y: [minX, maxX],
    mode: "lines",
    line: { dash: "dash", color: "#aaa" },
    hoverinfo: "skip",
    name: "参考线"
  });

  Plotly.newPlot('myplot', traces, {
    plot_bgcolor:"#23223b",
    paper_bgcolor:"#23223b",
    hovermode:false,
    xaxis:{ title:"Expected", fixedrange:true },
    yaxis:{ title:"Predicted", fixedrange:true }
  }, {
    staticPlot:true,
    responsive:true
  });

  initTooltip(data, minX, maxX, minY, maxY);
});


// ===== 🔥 核心：最近点 tooltip =====
function initTooltip(data, minX, maxX, minY, maxY) {

  const plot = document.getElementById('myplot');
  const tooltip = document.getElementById('tooltip');

  let lastPoint = null;
  let highlightIndex = null;

  function findNearest(mx, my, rect) {
    let best = null;
    let minDist = Infinity;

    for (const d of data) {

      const x = (d.expected - minX)/(maxX-minX)*rect.width;
      const y = rect.height - (d.predicted - minY)/(maxY-minY)*rect.height;

      const dx = x - mx;
      const dy = y - my;
      const dist = dx*dx + dy*dy;

      if (dist < minDist) {
        minDist = dist;
        best = d;
      }
    }

    return minDist < 500 ? best : null;
  }

  plot.addEventListener("mousemove", e => {
    const rect = plot.getBoundingClientRect();

    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    const point = findNearest(mx, my, rect);

    if (!point) {
      tooltip.classList.remove("show");
      lastPoint = null;
      return;
    }

    if (point === lastPoint) return;
    lastPoint = point;

    // ===== tooltip =====
    tooltip.innerHTML = `
      <div class="row">
        <div class="dot" style="background:${COLORS[point.group]}"></div>
        <b>${escapeHTML(point.name)}</b>
      </div>
      <div>Exp: ${point.expected}</div>
      <div>Got: ${point.predicted}</div>
      <div>Type: ${point.group}</div>
    `;

    tooltip.style.left = (mx + 15) + "px";
    tooltip.style.top = (my + 15) + "px";
    tooltip.classList.add("show");

    highlight(point);
  });

  plot.addEventListener("mouseleave", () => {
    tooltip.classList.remove("show");
  });

  function highlight(point) {
    if (highlightIndex !== null) {
      Plotly.deleteTraces('myplot', highlightIndex);
    }

    Plotly.addTraces('myplot', {
      x: [point.expected],
      y: [point.predicted],
      mode: "markers",
      marker: {
        size: 18,
        color: "#fff",
        line: { width: 3, color: COLORS[point.group] }
      },
      hoverinfo: "skip",
      showlegend: false
    }).then(i => highlightIndex = i);
  }
}
</script>

</body>
</html>
